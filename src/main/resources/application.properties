# ===============================
# Configuración del Servidor
# ===============================
spring.application.name=LearnTrack
server.port=8080

# ===============================
# Conexión a PostgreSQL
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/learntrack_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# ===============================
# Configuración de Hibernate / JPA
# ===============================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Configuración de Mail
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=copitocorp.soporte@gmail.com
spring.mail.password=uglw qpni narq hhya
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# Configuración de Ollama
# ===============================
spring.ai.openai.base-url=http://ollama:11434
spring.ai.openai.api-key=ollama
spring.ai.openai.chat.options.model=phi3:mini

